[project]
name = "accuribet-ml"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "torch>=2.11.0",
  "trio>=0.33.0",
]
dynamic = ["version"]

[dependency-groups]
gather = [
  "nba-api>=1.11.4",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = ".."
