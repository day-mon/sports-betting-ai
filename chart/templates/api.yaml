apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sports-betting.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: api
    {{- include "sports-betting.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      {{- include "sports-betting.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        {{- include "sports-betting.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- if .Values.secrets.enabled }}
          env:
            - name: REDIS_URL
              value: "redis://{{ include "sports-betting.fullname" . }}-redis:{{ .Values.redis.port }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sports-betting.fullname" . }}-secrets
                  key: database-url
            - name: WORKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sports-betting.fullname" . }}-secrets
                  key: worker-url
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sports-betting.fullname" . }}-api-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sports-betting.fullname" . }}-api-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.api.data.size }}
