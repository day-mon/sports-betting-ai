{{- if .Values.secrets.enabled }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "sports-betting.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    database-url: PLACEHOLDER_REPLACE_WITH_REAL_SEALED_VALUE
    worker-url: PLACEHOLDER_REPLACE_WITH_REAL_SEALED_VALUE
    postgres-password: PLACEHOLDER_REPLACE_WITH_REAL_SEALED_VALUE
  template:
    metadata:
      name: {{ include "sports-betting.fullname" . }}-secrets
      namespace: {{ .Release.Namespace }}
{{- end }}
