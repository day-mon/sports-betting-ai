{{- if .Values.secrets.enabled }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "sports-betting.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    database-url: 
    postgres-password: 
    worker-url: 
  template:
    metadata:
      name: {{ include "sports-betting.fullname" . }}-secrets
      namespace: {{ .Release.Namespace }}
{{- end }}
