apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sports-betting.fullname" . }}-website
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: website
    {{- include "sports-betting.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.website.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: website
      {{- include "sports-betting.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: website
        {{- include "sports-betting.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: website
          image: "{{ .Values.website.image.repository }}:{{ .Values.website.image.tag }}"
          imagePullPolicy: {{ .Values.website.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.website.port }}
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sports-betting.fullname" . }}-website
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: website
    {{- include "sports-betting.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.website.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: website
    {{- include "sports-betting.selectorLabels" . | nindent 4 }}
