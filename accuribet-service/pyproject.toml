[project]
name = "accuribet-service"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiohttp>=3.13.5",
  "aiohttp-retry>=2.9.1",
  "aiosqlite>=0.21.0",
  "asgi-correlation-id>=4.3.4",
  "asyncpg>=0.30.0",
  "cashews>=7.5.0",
  "fastapi>=0.135.3",
  "fastapi-utils>=0.8.0",
  "greenlet>=3.0.0",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.13.1",
  "sqlalchemy>=2.0.49",
  "structlog>=25.0.0",
  "alembic>=1.13.0",
]
dynamic = ["version"]

[project.scripts]
accuribet-service = "accuribet_service.main:main"

[dependency-groups]
dev = ["poethepoet>=0.33.0"]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = ".."

[tool.poe]
[tool.poe.tasks]
migrate = "alembic upgrade head"
serve = "accuribet-service"
dev = [{ "cmd" = "alembic upgrade head" }, { "cmd" = "accuribet-service" }]

[tool.pyrefly]
project-includes = ["src/**/*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
