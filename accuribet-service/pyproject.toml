[project]
name = "accuribet-service"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiohttp>=3.13.5",
  "aiosqlite>=0.21.0",
  "asyncpg>=0.30.0",
  "cashews>=7.5.0",
  "fastapi>=0.135.3",
  "fastapi-utils>=0.8.0",
  "hypercorn>=0.17.3",
  "pydantic-settings>=2.13.1",
  "sqlalchemy>=2.0.49",
]
dynamic = ["version"]

[project.scripts]
accuribet-service = "accuribet_service.main:main"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = ".."
